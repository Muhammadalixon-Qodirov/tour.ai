# Production: PostgreSQL + Go API; HTTPS — server nginx+certbot yoki Caddy (profil "caddy").
# Sirlar deploy/.env da (repoga kirmaydi). Boshqarish: deploy/README.md
name: yoldosh

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: yoldosh
      POSTGRES_USER: yoldosh
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD kerak}
    volumes: ["pgdata:/var/lib/postgresql"]   # tashqariga port ochilmaydi
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "yoldosh", "-d", "yoldosh"]
      interval: 5s
      retries: 30
    logging: *logging

  api:
    build: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://yoldosh:${DB_PASSWORD}@db:5432/yoldosh?sslmode=disable
      TOKEN_SECRET: ${TOKEN_SECRET:?TOKEN_SECRET kerak}
      PUBLIC_BASE_URL: https://${DOMAIN}
      # Sayt: story havolasi (/s/p/...), kod QR matni, joy sahifasi va namuna hamkor sahifasiga yo'naltirish
      WEB_BASE_URL: ${WEB_BASE_URL:-https://safar.e-investment.uz}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      EXPO_PUSH_ENABLED: ${EXPO_PUSH_ENABLED:-false}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      APP_NAME: ${APP_NAME:-Safar}
      # Yangi joylarni avtomatik topish (Wikidata, CC0): har 24 soatda. Bo'sh qiymat — o'chiq.
      DISCOVERY_EVERY: ${DISCOVERY_EVERY-24h}
      # OpenStreetMap yangilash (yangi kafe, muzey, bozorlar): haftada bir. Bo'sh qiymat — o'chiq.
      OSM_REFRESH_EVERY: ${OSM_REFRESH_EVERY-168h}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CLEANER_KEY: ${CLEANER_KEY:-}
      LENS_VISION_MODEL: ${LENS_VISION_MODEL:-}
      MARKET_PROXY: ${MARKET_PROXY:-}
      MARKET_FETCH_URL: ${MARKET_FETCH_URL:-}
      # Uzum anonim Bearer token (brauzer DevTools dan; ~12 soatda eskiradi). Bo'sh — Uzum o'chiq.
      UZUM_BEARER: ${UZUM_BEARER:-}
      STT_RELAY_SOCKET: ${STT_RELAY_SOCKET:-}
      STT_KOTIB_URL: ${STT_KOTIB_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_EFFORT: ${AI_EFFORT:-}
      # X-Forwarded-For ga ishoniladigan proksilar (IP yoki CIDR, vergul bilan): host nginx konteynerga docker
      # tarmog'i shlyuzidan keladi (172.16.0.0/12), Caddy profili ham shu tarmoqda; + sayt (Next.js) serveri IP si.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Safar <noreply@e-investment.uz>}
    volumes: ["uploads:/app/data/uploads", "stt_sock:/run/stt"]
    ports: ["127.0.0.1:${API_PORT:-8130}:8080"]   # faqat lokal: tashqariga nginx yoki Caddy orqali
    depends_on:
      db: { condition: service_healthy }
    logging: *logging

  # Market proksi: narx qidiruvi O'zbekistondagi server IP si orqali ketadi (OLX, Asaxiy, Olcha xorijiy IP ni bloklaydi).
  # Cheklangan SSH kalit (faqat market manzillariga yo'naltirish, shell yo'q). Yoqish: COMPOSE_PROFILES=marketproxy,
  # MARKET_PROXY=socks5://market-proxy:1080, secrets/market_proxy_key va secrets/market_proxy_known_hosts.
  market-proxy:
    profiles: ["marketproxy"]
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:3.20
        RUN apk add --no-cache openssh-client
    restart: unless-stopped
    command: ["ssh", "-N", "-D", "0.0.0.0:1080", "-p", "${MARKET_PROXY_SSH_PORT:-22}", "-i", "/secrets/market_proxy_key",
      "-o", "IdentitiesOnly=yes", "-o", "UserKnownHostsFile=/secrets/market_proxy_known_hosts", "-o", "StrictHostKeyChecking=yes",
      "-o", "ExitOnForwardFailure=yes", "-o", "ServerAliveInterval=30", "-o", "ServerAliveCountMax=3",
      "${MARKET_PROXY_SSH:-user@host}"]
    volumes:
      - ./secrets/market_proxy_key:/secrets/market_proxy_key:ro
      - ./secrets/market_proxy_known_hosts:/secrets/market_proxy_known_hosts:ro

  # STT relay: serverdagi o'zbekcha Kotib modeli (teskari SSH tunnellar, xostning 127.0.0.1:8093 / 7009) uchun ko'prik.
  # API konteyneri xostning lokal portlariga yeta olmaydi (firewall) — relay xost tarmog'ida ishlaydi va API bilan
  # unix-socket orqali gaplashadi. Yoqish: COMPOSE_PROFILES ga sttrelay, STT_RELAY_SOCKET=/run/stt/stt.sock.
  stt-relay:
    profiles: ["sttrelay"]
    build:
      context: ./stt-relay
      dockerfile_inline: |
        FROM alpine:3.20
        RUN apk add --no-cache python3 ffmpeg
        COPY relay.py /app/relay.py
        CMD ["python3", "-u", "/app/relay.py"]
    network_mode: host
    restart: unless-stopped
    environment:
      STT_SOCKET: /run/stt/stt.sock
    volumes:
      - stt_sock:/run/stt
    logging: *logging

  # Kotib — o'zbekcha STT serverning o'zida (CPU, faster-whisper int8). GPU kompyuter o'chiq bo'lsa ham ishlaydi.
  # Yoqish: COMPOSE_PROFILES ga sttkotib, STT_KOTIB_URL=http://stt-kotib:8000. Birinchi build ~3 GB model yuklaydi.
  stt-kotib:
    profiles: ["sttkotib"]
    build: ./stt-kotib
    restart: unless-stopped
    cpus: 4
    mem_limit: 3g
    environment:
      KOTIB_THREADS: "4"
    logging: *logging

  # market-fetch: marketlardan sahifa oladi (curl — brauzer TLS izi; OLX, Uzum Go mijozini bloklaydi). market-proxy
  # orqali O'zbekiston IP sidan. Yoqish: COMPOSE_PROFILES ga marketproxy, MARKET_FETCH_URL=http://market-fetch:8890.
  market-fetch:
    profiles: ["marketproxy"]
    build: ./market-fetch
    restart: unless-stopped
    environment:
      MARKET_PROXY_SOCKS: ${MARKET_PROXY_SOCKS:-market-proxy:1080}
    depends_on: ["market-proxy"]
    logging: *logging

  caddy:                     # faqat 80/443 bo'sh serverda (COMPOSE_PROFILES=caddy)
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
      SERVER_IP: ${SERVER_IP}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    logging: *logging

volumes:
  stt_sock:
  pgdata: {}
  uploads: {}
  caddy_data: {}
  caddy_config: {}
