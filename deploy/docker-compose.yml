# Production: PostgreSQL + Go API; HTTPS — server nginx+certbot yoki Caddy (profil "caddy").
# Sirlar deploy/.env da (repoga kirmaydi). Boshqarish: deploy/README.md
name: yoldosh

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: yoldosh
      POSTGRES_USER: yoldosh
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD kerak}
    volumes: ["pgdata:/var/lib/postgresql"]   # tashqariga port ochilmaydi
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "yoldosh", "-d", "yoldosh"]
      interval: 5s
      retries: 30
    logging: *logging

  api:
    build: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://yoldosh:${DB_PASSWORD}@db:5432/yoldosh?sslmode=disable
      TOKEN_SECRET: ${TOKEN_SECRET:?TOKEN_SECRET kerak}
      PUBLIC_BASE_URL: https://${DOMAIN}
      # Sayt: story havolasi (/s/p/...), kod QR matni, joy sahifasi va namuna hamkor sahifasiga yo'naltirish
      WEB_BASE_URL: ${WEB_BASE_URL:-https://safar.e-investment.uz}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      EXPO_PUSH_ENABLED: ${EXPO_PUSH_ENABLED:-false}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      APP_NAME: ${APP_NAME:-Safar}
      # Yangi joylarni avtomatik topish (Wikidata, CC0): har 24 soatda. Bo'sh qiymat — o'chiq.
      DISCOVERY_EVERY: ${DISCOVERY_EVERY-24h}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CLEANER_KEY: ${CLEANER_KEY:-}
      LENS_VISION_MODEL: ${LENS_VISION_MODEL:-}
      MARKET_PROXY: ${MARKET_PROXY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_EFFORT: ${AI_EFFORT:-}
      # X-Forwarded-For ga ishoniladigan proksilar (IP yoki CIDR, vergul bilan): host nginx konteynerga docker
      # tarmog'i shlyuzidan keladi (172.16.0.0/12), Caddy profili ham shu tarmoqda; + sayt (Next.js) serveri IP si.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Safar <noreply@e-investment.uz>}
    volumes: ["uploads:/app/data/uploads"]
    ports: ["127.0.0.1:${API_PORT:-8130}:8080"]   # faqat lokal: tashqariga nginx yoki Caddy orqali
    depends_on:
      db: { condition: service_healthy }
    logging: *logging

  caddy:                     # faqat 80/443 bo'sh serverda (COMPOSE_PROFILES=caddy)
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
      SERVER_IP: ${SERVER_IP}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    logging: *logging

volumes:
  pgdata: {}
  uploads: {}
  caddy_data: {}
  caddy_config: {}
