# Yo'ldosh AI API — faqat shu server_name uchun ishlaydi; boshqa saytlarga ta'sir qilmaydi.
# setup.sh __DOMAIN__ va __PORT__ ni almashtiradi; certbot keyin HTTPS blokini qo'shadi.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 10m;   # rasm yuklash (8 MB) uchun

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
